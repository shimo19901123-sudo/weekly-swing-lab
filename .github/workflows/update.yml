name: SWING LAB Auto Update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily or friday"
        required: true
        default: daily
        type: choice
        options:
          - daily
          - friday
  schedule:
    - cron: '10 8 * * 1-5'
    - cron: '20 11 * * 5'

permissions:
  contents: write

concurrency:
  group: swing-lab-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update Friday ranking
        if: (github.event_name == 'schedule' && github.event.schedule == '20 11 * * 5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'friday')
        run: python update_data.py --mode friday

      - name: Update prices and indicators
        run: python daily_prices.py

      - name: Update simulation
        run: python update_data.py --mode daily

      - name: Save data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json archive.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update swing data'
            git push
          fi
